name: Driver tests (no engine)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/check_repository.py
      - run: python nvda/test/sequence.py
      - run: python nvda/test/engine.py
      - run: python nvda/test/settings.py
      - run: python nvda/test/punctuation.py
